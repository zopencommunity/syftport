name: Copilot Port Build Auto-Fix

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze and fix'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    # Trigger ONLY when:
    # 1. "Build and Test" workflow completes with failure
    # 2. Someone comments "/fix" on the PR
    # 3. Manual workflow_dispatch
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout zopen meta repository
        uses: actions/checkout@v4
        with:
          repository: Geetha-Sushma-Dhulipudi/meta
          ref: feature/copilot-autofix
          path: meta_tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify zopen presence & Run Build Failure Analysis
        id: triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/gh-aw/autofix
          python3 meta_tools/tools/port_build_autofix.py \
            --port-dir . \
            --meta-dir meta_tools \
            --output /tmp/gh-aw/autofix/facts.md \
            --output-response /tmp/gh-aw/autofix/response.md

          if grep -q "❌ Failed Patches Detected" /tmp/gh-aw/autofix/facts.md; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Copilot Patch File Comment on PR
        if: steps.triage.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let commentBody = '';
            
            if (fs.existsSync('/tmp/gh-aw/autofix/response.md')) {
              commentBody = fs.readFileSync('/tmp/gh-aw/autofix/response.md', 'utf8');
            } else {
              commentBody = fs.readFileSync('/tmp/gh-aw/autofix/facts.md', 'utf8');
            }

            const issue_number = context.issue.number || 
                                 context.payload.pull_request?.number || 
                                 context.payload.workflow_run?.pull_requests?.[0]?.number ||
                                 context.payload.inputs?.pr_number;
            
            if (issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: "### 🤖 GitHub Copilot Build Auto-Fix\n\n" + commentBody
              });
            } else {
              console.log("No PR number found to comment on. Output logged in Actions console.");
            }
