name: Copilot Port Build Auto-Fix

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze and fix'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    # Trigger if manual dispatch, or comment contains /fix, or previous Build and Test failed
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout zopen meta repository
        uses: actions/checkout@v4
        with:
          repository: Geetha-Sushma-Dhulipudi/meta
          ref: feature/copilot-autofix
          path: meta_tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Build Triage and Patch Dry-Run
        id: triage
        run: |
          mkdir -p /tmp/gh-aw/autofix
          python3 meta_tools/tools/port_build_autofix.py \
            --port-dir . \
            --meta-dir meta_tools \
            --output /tmp/gh-aw/autofix/facts.md \
            --skip-build

          if grep -q "❌ Failed Patches Detected" /tmp/gh-aw/autofix/facts.md; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Triage & Fix Context
        if: steps.triage.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const facts = fs.readFileSync('/tmp/gh-aw/autofix/facts.md', 'utf8');
            const issue_number = context.issue.number || context.payload.pull_request?.number || context.payload.inputs?.pr_number;
            
            if (issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: "### 🤖 Copilot Build Triage Initiated\n\n" + facts
              });
            }
